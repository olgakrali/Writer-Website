<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Author Website</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

</head>
<body>

    <div class="author-header">
        <div class="author-text">
            <h1>Olga Krali</h1>
            <h2> Sci-fi romance writer</h2>
            
         </div>
        <img src="./photos/KraliOlga.jpg"
            alt="Portrait of the author"
            class="author-photo">
    </div>



    <div class="intro-section">
        <p>From structured writing to creating universes</p>

        <a href="about.html" class="about-button">
            My intercosmic journey
        </a>
    </div>


    <div class="constellation">

        <svg viewBox="0 0 900 900"
            xmlns="http://www.w3.org/2000/svg">

            <!-- Circular photo masks -->
            <defs>
                <clipPath id="main-circle">
                    <circle cx="450" cy="420" r="190"/>
                </clipPath>

                <clipPath id="circle-2">
                    <circle cx="460" cy="85" r="30"/>
                </clipPath>

                <clipPath id="circle-3">
                    <circle cx="125" cy="220" r="38"/>
                </clipPath>

                <clipPath id="circle-4">
                    <circle cx="775" cy="210" r="32"/>
                </clipPath>

                <clipPath id="circle-5">
                    <circle cx="95" cy="565" r="42"/>
                </clipPath>

                <clipPath id="circle-6">
                    <circle cx="810" cy="560" r="35"/>
                </clipPath>

                <clipPath id="circle-7">
                    <circle cx="415" cy="785" r="45"/>
                </clipPath>
            </defs>

            <!-- Constellation lines -->
            <g stroke="#c9b8ff"
            stroke-width="3">

                <line x1="450" y1="230" x2="460" y2="85"/>
                <line x1="275" y1="330" x2="125" y2="220"/>
                <line x1="625" y1="330" x2="775" y2="210"/>
                <line x1="270" y1="495" x2="95" y2="565"/>
                <line x1="630" y1="495" x2="810" y2="560"/>
                <line x1="450" y1="610" x2="415" y2="785"/>
            </g>

            <!-- Photo 1: central circle -->
            <g class="constellation-photo"
            data-photo="1"
            role="button"
            tabindex="0"
            aria-label="Open photograph 1">

                <image href="photos/image1.jpeg"
                    x="260" y="230"
                    width="380" height="380"
                    preserveAspectRatio="xMidYMid slice"
                    clip-path="url(#main-circle)"/>
            </g>
            <!-- Photo 2: top -->
            <g class="constellation-photo"
                data-photo="2"
                role="button"
                tabindex="0"
                aria-label="Open photograph 2">

                    <image href="photos/image2.jpeg"
                        x="430" y="55"
                        width="60" height="60"
                        preserveAspectRatio="xMidYMid slice"
                        clip-path="url(#circle-2)"/>

            </g>

            <!-- Photo 3: upper left -->
            <g class="constellation-photo"
                data-photo="3"
                role="button"
                tabindex="0"
                aria-label="Open photograph 3">

                <image href="photos/image3.jpeg"
                    x="87" y="182"
                    width="76" height="76"
                    preserveAspectRatio="xMidYMid slice"
                    clip-path="url(#circle-3)"/>
            </g>

            <!-- Photo 4: upper right -->
            <g class="constellation-photo"
                data-photo="4"
                role="button"
                tabindex="0"
                aria-label="Open photograph 4">
                <image href="photos/image4.jpeg"
                    x="743" y="178"
                    width="64" height="64"
                    preserveAspectRatio="xMidYMid slice"
                    clip-path="url(#circle-4)"/>
            </g>

            <!-- Photo 5: lower left -->
             <g class="constellation-photo"
                data-photo="5"
                role="button"
                tabindex="0"
                aria-label="Open photograph 5">
                <image href="photos/image5.jpeg"
                    x="53" y="523"
                    width="84" height="84"
                    preserveAspectRatio="xMidYMid slice"
                    clip-path="url(#circle-5)"/>
            </g>

            <!-- Photo 6: lower right -->
             <g class="constellation-photo"
                data-photo="6"
                role="button"
                tabindex="0"
                aria-label="Open photograph 6">            
                <image href="photos/image6.jpeg"
                    x="775" y="525"
                    width="70" height="70"
                    preserveAspectRatio="xMidYMid slice"
                    clip-path="url(#circle-6)"/>
            </g>
            <!-- Photo 7: bottom -->
             <g class="constellation-photo"
                data-photo="7"
                role="button"
                tabindex="0"
                aria-label="Open photograph 7">
                <image href="photos/image7.jpeg"
                    x="370" y="740"
                    width="90" height="90"
                    preserveAspectRatio="xMidYMid slice"
                    clip-path="url(#circle-7)"/>
            </g>
            <!-- Circle outlines -->
            <g fill="none"
            stroke="#c9b8ff"
            stroke-width="4">

                <circle cx="450" cy="420" r="190"/>
                <circle cx="460" cy="85" r="30"/>
                <circle cx="125" cy="220" r="38"/>
                <circle cx="775" cy="210" r="32"/>
                <circle cx="95" cy="565" r="42"/>
                <circle cx="810" cy="560" r="35"/>
                <circle cx="415" cy="785" r="45"/>
            </g>

        </svg>
    </div>

<!-- Expanded photograph and book quotation -->

<div class="photo-modal" id="photo-modal"
     role="dialog"
     aria-modal="true"
     aria-label="Photograph and book quotation"
     hidden>

    <button class="modal-close"
            id="modal-close"
            type="button"
            aria-label="Close photograph">
        &times;
    </button>

    <div class="modal-content">

        <img id="modal-image"
             src=""
             alt="Astrophotography by the author">

        <p id="modal-quote"></p>

    </div>

</div>



    <div class="contact-section">
        <button class="about-button" id="contact-button"
                type="button">
            Contact Me
        </button>

        <p id="contact-email" hidden></p>
    </div>

    <script>
        const contactButton =
            document.getElementById("contact-button");

        const contactEmail =
            document.getElementById("contact-email");

        contactButton.addEventListener("click", function() {
            const username = "olga.krali";
            const domain = "icloud.com";

            const email = username + "@" + domain;

            const link = document.createElement("a");
            link.href = "mailto:" + email;
            link.textContent = email;

            contactEmail.replaceChildren(link);
            contactEmail.hidden = false;
        });
    </script>


<script>
    // Each photograph has its own book quotation

    const photos = {
        1: {
            image: "photos/image1.jpeg",
            quote: "The stars will stop flickering in the sky and the flowers won't wither in the air. Instead, they'll breathe for each other."
        },

        2: {
            image: "photos/image2.jpeg",
            quote: "Your second quotation goes here."
        },

        3: {
            image: "photos/image3.jpeg",
            quote: "Your third quotation goes here."
        },

        4: {
            image: "photos/image4.jpeg",
            quote: "Your fourth quotation goes here."
        },

        5: {
            image: "photos/image5.jpeg",
            quote: "Your fifth quotation goes here."
        },

        6: {
            image: "photos/image6.jpeg",
            quote: "Your sixth quotation goes here."
        },

        7: {
            image: "photos/image7.jpeg",
            quote: "Your seventh quotation goes here."
        }
    };

    const modal = document.getElementById("photo-modal");
    const modalImage = document.getElementById("modal-image");
    const modalQuote = document.getElementById("modal-quote");
    const closeButton = document.getElementById("modal-close");

    let previousFocus = null;

    // Open a photograph

    function openPhoto(number) {
        const photo = photos[number];

        if (!photo) return;

        previousFocus = document.activeElement;

        modalImage.src = photo.image;
        modalQuote.textContent = photo.quote;

        modal.hidden = false;
        closeButton.focus();
    }

    // Close the expanded photograph

    function closePhoto() {
        modal.hidden = true;
        modalImage.removeAttribute("src");

        if (previousFocus) {
            previousFocus.focus();
        }
    }

    // Make all seven circles interactive

    document.querySelectorAll(".constellation-photo")
        .forEach(circle => {

            circle.addEventListener("click", function() {
                openPhoto(this.dataset.photo);
            });

            // Allow keyboard interaction

            circle.addEventListener("keydown", function(event) {
                if (event.key === "Enter" ||
                    event.key === " ") {

                    event.preventDefault();
                    openPhoto(this.dataset.photo);
                }
            });
        });

    // Close using the X button

    closeButton.addEventListener("click", closePhoto);

    // Close by clicking the dark background

    modal.addEventListener("click", function(event) {
        if (event.target === modal) {
            closePhoto();
        }
    });

    // Close using Escape

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape" && !modal.hidden) {
            closePhoto();
        }

        // Keep keyboard focus inside the open dialog
        if (event.key === "Tab" && !modal.hidden) {
            event.preventDefault();
            closeButton.focus();
        }
    });
</script>




        

</body>
</html>
